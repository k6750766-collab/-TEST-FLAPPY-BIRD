<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Bird</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b1a;
            overflow: hidden;
            font-family: 'Montserrat', Arial, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0b0b1a;
        }
        .ui-top-left {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none;
        }
        .ui-top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none;
        }
        .score-center {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        .start-screen, .leaderboard-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            background: rgba(20, 20, 35, 0.95);
            padding: 25px 20px;
            border-radius: 16px;
            border: 2px solid #555;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 20;
            width: 85%;
            max-width: 320px;
        }
        .start-screen h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
        }
        .start-screen p {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
        }
        .btn {
            background-color: #9370DB;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.4);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background-color: #483D8B;
            box-shadow: 0 4px 15px rgba(72, 61, 139, 0.4);
        }
        .leaderboard-screen {
            display: none;
        }
        .leaderboard-screen h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }
        .scores-list {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            border-top: 2px solid #444;
            border-bottom: 2px solid #444;
            padding: 5px 0;
        }
        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px dashed #333;
            color: #ddd;
        }
        .score-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="ui-top-left" id="fpsDisplay">FPS: 0</div>
    <div class="ui-top-right" id="recordDisplay">Record: 0</div>
    <div class="score-center" id="scoreDisplay">0</div>

    <div class="start-screen" id="startScreen">
        <h1>Space Bird</h1>
        <p>Тапни по экрану, чтобы лететь</p>
        <button class="btn" id="playBtn">Старт</button>
        <button class="btn btn-secondary" id="openLeadersBtn">🏆 Рекорды</button>
    </div>

    <div class="leaderboard-screen" id="leaderboardScreen">
        <h2>Топ Игроков</h2>
        <div class="scores-list" id="scoresList">Загрузка...</div>
        <button class="btn btn-secondary" id="closeLeadersBtn">Назад</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
            const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

            const tg = window.Telegram?.WebApp;
            let playerName = "Игрок";
            if (tg) {
                try {
                    tg.expand();
                    if (typeof tg.disableVerticalSwipes === 'function') {
                        tg.disableVerticalSwipes();
                    }
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        playerName = tg.initDataUnsafe.user.first_name || tg.initDataUnsafe.user.username || "Игрок";
                    }
                } catch(e) {}
            }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            });

            let stars = [];
            for (let i = 0; i < 70; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2.2 + 0.8,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }

            let gameState = 'START'; 
            let score = 0;
            let leaderboard = [];
            let highScore = 0;

            async function loadLeaderboard() {
                if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_URL) {
                    leaderboard = JSON.parse(localStorage.getItem('flappy_local_leaderboard')) || [];
                    updateHighScore();
                    return;
                }

                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*&order=score.desc&limit=10`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    if (response.ok) {
                        leaderboard = await response.json();
                        updateHighScore();
                    } else {
                        leaderboard = JSON.parse(localStorage.getItem('flappy_local_leaderboard')) || [];
                        updateHighScore();
                    }
                } catch (e) {
                    leaderboard = JSON.parse(localStorage.getItem('flappy_local_leaderboard')) || [];
                    updateHighScore();
                }
            }

            async function saveScoreToDatabase(currentScore) {
                if (currentScore <= 0) return;

                let localList = JSON.parse(localStorage.getItem('flappy_local_leaderboard')) || [];
                localList.push({ name: playerName, score: currentScore });
                localList.sort((a, b) => b.score - a.score);
                localStorage.setItem('flappy_local_leaderboard', JSON.stringify(localList));

                if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_URL) return;

                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({ name: playerName, score: currentScore })
                    });
                    loadLeaderboard();
                } catch (e) {}
            }

            function updateHighScore() {
                if (leaderboard.length > 0) {
                    highScore = leaderboard[0].score;
                } else {
                    highScore = 0;
                }
                document.getElementById('recordDisplay').innerText = `Record: ${highScore}`;
            }

            function renderLeaderboard() {
                const listEl = document.getElementById('scoresList');
                listEl.innerHTML = '';
                if (leaderboard.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: #888; padding: 10px;">Пока нет рекордов</div>';
                    return;
                }
                leaderboard.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'score-item';
                    div.innerHTML = `<span><b>${index + 1}.</b> ${item.name}</span> <span><b>${item.score}</b></span>`;
                    listEl.appendChild(div);
                });
            }

            loadLeaderboard();

            const bird = {
                x: width * 0.25,
                y: height / 2,
                radius: 15,
                gravity: 0.38,
                lift: -6.8,
                velocity: 0,
                rotation: 0
            };

            let pipes = [];
            const pipeWidth = 65;
            const pipeGap = 160;
            const pipeSpeed = 2.6;
            let pipeTimer = 0;
            const pipeInterval = 1.6;

            let lastTime = performance.now();
            let frameCountFPS = 0;
            let lastFPSUpdate = performance.now();
            let fps = 0;

            function resetGame() {
                bird.y = height / 2;
                bird.velocity = 0;
                bird.rotation = 0;
                pipes = [];
                score = 0;
                pipeTimer = 0;
                document.getElementById('scoreDisplay').innerText = score;
            }

            function jump() {
                if (gameState === 'PLAYING') {
                    bird.velocity = bird.lift;
                }
            }

            canvas.addEventListener('pointerdown', () => {
                if (gameState === 'PLAYING') {
                    jump();
                } else if (gameState === 'GAMEOVER') {
                    resetGame();
                    gameState = 'PLAYING';
                } else if (gameState === 'START') {
                    gameState = 'PLAYING';
                    document.getElementById('startScreen').style.display = 'none';
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    if (gameState === 'PLAYING') jump();
                    else if (gameState === 'START') {
                        gameState = 'PLAYING';
                        document.getElementById('startScreen').style.display = 'none';
                    } else if (gameState === 'GAMEOVER') {
                        resetGame();
                        gameState = 'PLAYING';
                    }
                }
            });

            document.getElementById('playBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                gameState = 'PLAYING';
                document.getElementById('startScreen').style.display = 'none';
            });

            document.getElementById('openLeadersBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                loadLeaderboard().then(() => renderLeaderboard());
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('leaderboardScreen').style.display = 'block';
                gameState = 'LEADERBOARD';
            });

            document.getElementById('closeLeadersBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('leaderboardScreen').style.display = 'none';
                if (score > 0 || gameState === 'GAMEOVER') {
                    document.getElementById('startScreen').style.display = 'block';
                    document.getElementById('startScreen').innerHTML = `
                        <h1>Game Over</h1>
                        <p>Счёт: ${score}</p>
                        <button class="btn" id="restartBtn">Играть снова</button>
                        <button class="btn btn-secondary" id="openLeadersBtn2">🏆 Рекорды</button>
                    `;
                    initGameOverButtons();
                    gameState = 'GAMEOVER';
                } else {
                    document.getElementById('startScreen').style.display = 'block';
                    gameState = 'START';
                }
            });

            function initGameOverButtons() {
                document.getElementById('restartBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    resetGame();
                    document.getElementById('startScreen').style.display = 'none';
                    gameState = 'PLAYING';
                });
                document.getElementById('openLeadersBtn2').addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadLeaderboard().then(() => renderLeaderboard());
                    document.getElementById('startScreen').style.display = 'none';
                    document.getElementById('leaderboardScreen').style.display = 'block';
                    gameState = 'LEADERBOARD';
                });
            }

            function update(dt, timeScale) {
                for (let star of stars) {
                    star.x -= star.speed * timeScale;
                    if (star.x < 0) {
                        star.x = width;
                        star.y = Math.random() * height;
                    }
                }

                if (gameState === 'PLAYING') {
                    bird.velocity += bird.gravity * timeScale;
                    bird.y += bird.velocity * timeScale;

                    if (bird.velocity < 0) {
                        bird.rotation = -0.4;
                    } else {
                        bird.rotation = Math.min(Math.PI / 2, bird.rotation + 0.05 * timeScale);
                    }

                    const groundHeight = 60;
                    if (bird.y + bird.radius >= height - groundHeight) {
                        bird.y = height - groundHeight - bird.radius;
                        gameOver();
                    }
                    if (bird.y - bird.radius <= 0) {
                        bird.y = bird.radius;
                        bird.velocity = 0;
                    }

                    pipeTimer += dt;
                    if (pipeTimer >= pipeInterval) {
                        pipeTimer = 0;
                        const minHeight = 60;
                        const maxHeight = height - groundHeight - pipeGap - 60;
                        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                        
                        pipes.push({
                            x: width,
                            topHeight: topHeight,
                            bottomY: topHeight + pipeGap,
                            passed: false
                        });
                    }

                    for (let i = pipes.length - 1; i >= 0; i--) {
                        pipes[i].x -= pipeSpeed * timeScale;

                        if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                            score++;
                            pipes[i].passed = true;
                            document.getElementById('scoreDisplay').innerText = score;
                        }

                        if (
                            bird.x + bird.radius > pipes[i].x &&
                            bird.x - bird.radius < pipes[i].x + pipeWidth &&
                            (bird.y - bird.radius < pipes[i].topHeight || bird.y + bird.radius > pipes[i].bottomY)
                        ) {
                            gameOver();
                        }

                        if (pipes[i].x + pipeWidth < 0) {
                            pipes.splice(i, 1);
                        }
                    }
                }
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                saveScoreToDatabase(score);
                
                const startScreen = document.getElementById('startScreen');
                startScreen.innerHTML = `
                    <h1>Game Over</h1>
                    <p>Счёт: ${score}</p>
                    <button class="btn" id="restartBtn">Играть снова</button>
                    <button class="btn btn-secondary" id="openLeadersBtn2">🏆 Рекорды</button>
                `;
                startScreen.style.display = 'block';
                initGameOverButtons();
            }

            function draw() {
                ctx.fillStyle = '#0b0b1a';
                ctx.fillRect(0, 0, width, height);

                for (let star of stars) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                }

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#222233';

                for (let pipe of pipes) {
                    ctx.fillStyle = '#D4D4D4';
                    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                    ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);

                    ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, height - pipe.bottomY);
                    ctx.strokeRect(pipe.x, pipe.bottomY, pipeWidth, height - pipe.bottomY);

                    const lipHeight = 22;
                    const lipOverflow = 4;

                    ctx.fillStyle = '#C0C0C0';
                    ctx.fillRect(pipe.x - lipOverflow, pipe.topHeight - lipHeight, pipeWidth + (lipOverflow * 2), lipHeight);
                    ctx.strokeRect(pipe.x - lipOverflow, pipe.topHeight - lipHeight, pipeWidth + (lipOverflow * 2), lipHeight);

                    ctx.fillRect(pipe.x - lipOverflow, pipe.bottomY, pipeWidth + (lipOverflow * 2), lipHeight);
                    ctx.strokeRect(pipe.x - lipOverflow, pipe.bottomY, pipeWidth + (lipOverflow * 2), lipHeight);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fillRect(pipe.x + 6, 0, 5, pipe.
