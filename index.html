<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Runner Mini App</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Яркий небесный фон */
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #2c3e50;
        }
        h1 { margin-top: 0; color: #b71540; font-size: 26px; }
        p { color: #666; font-size: 14px; line-height: 1.4; }
        button {
            background: #b71540;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(183,21,64,0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div id="ui">Счет: <span id="score">0</span></div>
    
    <div id="startScreen">
        <h1>SKY RUNNER</h1>
        <p>Уворачивайся от контейнеров и обломков на красной рампе, двигая палец по экрану!</p>
        <button id="startBtn">ИГРАТЬ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameRunning = false;
        let score = 0;
        let playerX = canvas.width / 2;
        let targetX = canvas.width / 2;
        let obstacles = [];
        let speed = 6;
        let frameCount = 0;

        // Управление касанием пальца / мышкой
        window.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            targetX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            targetX = e.clientX;
        });

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            resetGame();
            gameRunning = true;
            requestAnimationFrame(update);
        });

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            obstacles = [];
            speed = 6;
            playerX = canvas.width / 2;
            targetX = canvas.width / 2;
        }

        function spawnObstacle() {
            // Случайный выбор: контейнер или обломки
            const type = Math.random() < 0.6 ? 'container' : 'debris';
            const width = type === 'container' ? 80 : 50;
            const height = type === 'container' ? 45 : 35;
            
            const rampWidth = canvas.width * 0.75;
            const minX = (canvas.width - rampWidth) / 2;
            const x = minX + Math.random() * (rampWidth - width);
            
            obstacles.push({ x: x, y: -60, width: width, height: height, type: type });
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;
            if (frameCount % 32 === 0) {
                spawnObstacle();
                speed += 0.04;
            }

            // Плавное следование за пальцем
            playerX += (targetX - playerX) * 0.2;

            // Границы рампы
            const rampWidth = canvas.width * 0.75;
            const minX = (canvas.width - rampWidth) / 2;
            const maxX = minX + rampWidth - 35;
            if (playerX < minX) playerX = minX;
            if (playerX > maxX) playerX = maxX;

            // Логика препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += speed;

                const playerY = canvas.height - 140;
                const playerWidth = 35;
                const playerHeight = 55;

                // Проверка столкновений
                if (
                    playerX < obstacles[i].x + obstacles[i].width &&
                    playerX + playerWidth > obstacles[i].x &&
                    playerY < obstacles[i].y + obstacles[i].height &&
                    playerY + playerHeight > obstacles[i].y
                ) {
                    gameRunning = false;
                    
                    // Тактильный отклик в Telegram при аварии
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                        Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                    }

                    alert('Ой! Столкновение. Счёт: ' + Math.floor(score));
                    startScreen.style.display = 'block';
                    return;
                }

                // Удаление прошедших препятствий и начисление очков
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = Math.floor(score);
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка КРАСНОЙ рампы
            const rampWidth = canvas.width * 0.75;
            const topWidth = canvas.width * 0.25;
            const centerX = canvas.width / 2;

            // Основная дорога (насыщенный красный цвет)
            ctx.fillStyle = '#b71540';
            ctx.beginPath();
            ctx.moveTo(centerX - topWidth/2, 0);
            ctx.lineTo(centerX + topWidth/2, 0);
            ctx.lineTo(centerX + rampWidth/2, canvas.height);
            ctx.lineTo(centerX - rampWidth/2, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Яркие контрастные бортики рампы
            ctx.strokeStyle = '#ff6b81';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX - topWidth/2, 0);
            ctx.lineTo(centerX - rampWidth/2, canvas.height);
            ctx.moveTo(centerX + topWidth/2, 0);
            ctx.lineTo(centerX + rampWidth/2, canvas.height);
            ctx.stroke();

            // Отрисовка препятствий (контейнеры и обломки)
            obstacles.forEach(obs => {
                if (obs.type === 'container') {
                    // Грузовой контейнер (синий металлический блок с ребрами жесткости)
                    ctx.fillStyle = '#0984e3';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    
                    // Полоски контейнера
                    ctx.strokeStyle = '#74b9ff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + 12); ctx.lineTo(obs.x + obs.width, obs.y + 12);
                    ctx.moveTo(obs.x, obs.y + 28); ctx.lineTo(obs.x + obs.width, obs.y + 28);
                    ctx.stroke();

                    // Рамка контейнера
                    ctx.strokeStyle = '#2980b9';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else {
                    // Обломки (угловатые серо-металлические куски)
                    ctx.fillStyle = '#636e72';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();

                    // Текстура обломка
                    ctx.strokeStyle = '#b2bec3';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Отрисовка персонажа (бегун)
            const pX = playerX + 10;
            const pY = canvas.height - 140;

            // Голова
            ctx.fillStyle = '#ffbe76';
            ctx.beginPath();
            ctx.arc(pX + 7, pY + 8, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2f3640';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Тело
            ctx.strokeStyle = '#00b894';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(pX + 7, pY + 16);
            ctx.lineTo(pX + 7, pY + 38);
            ctx.stroke();

            // Руки с анимацией бега
            let armSwing = Math.sin(frameCount * 0.2) * 8;
            ctx.strokeStyle = '#2f3640';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pX + 7, pY + 22);
            ctx.lineTo(pX - 5, pY + 28 + armSwing);
            ctx.moveTo(pX + 7, pY + 22);
            ctx.lineTo(pX + 19, pY + 28 - armSwing);
            ctx.stroke();

            // Ноги с анимацией бега
            let legSwing = Math.cos(frameCount * 0.2) * 10;
            ctx.beginPath();
            ctx.moveTo(pX + 7, pY + 38);
            ctx.lineTo(pX - 2, pY + 52 - legSwing);
            ctx.moveTo(pX + 7, pY + 38);
            ctx.lineTo(pX + 16, pY + 52 + legSwing);
            ctx.stroke();
        }
    </script>
</body>
</html>
